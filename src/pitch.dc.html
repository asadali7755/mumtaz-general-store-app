<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<title>Why this app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Naskh+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B5D3B}a:hover{color:#08452C}
.scr{scrollbar-width:none}
.scr::-webkit-scrollbar{display:none}
button{font-family:inherit}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4EF; color: #15201A; overflow: hidden; font-family: {{font}}">
  <div style="background: #0B5D3B; color: #FFFFFF; padding: 20px 18px 22px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <div style="width: 44px; height: 44px; border-radius: 14px; background: #F2B33D; color: #3B2A00; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px">{{t.logo}}</div>
      <button aria-label="Language" onClick="{{toggleLang}}" style="height: 44px; padding: 0 14px; border-radius: 99px; border: 1px solid rgba(255, 255, 255, 0.35); background: transparent; color: #FFFFFF; font-size: 14px; font-weight: 600; cursor: pointer">{{t.langOther}}</button>
    </div>
    <div style="font-size: 24px; font-weight: 800; line-height: 1.5">{{t.title}}</div>
    <div style="font-size: 14px; color: #D3EADC; line-height: 1.8">{{t.sub}}</div>
  </div>
  <div class="scr" style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px">
    <div style="background: #FFFFFF; border: 1px solid #E7E8E2; border-radius: 22px; padding: 16px">
      <div style="font-size: 12px; font-weight: 700; color: #A12A1F; letter-spacing: 0.04em; margin-bottom: 8px">{{t.probH}}</div>
      <sc-for list="{{probs}}" as="x" hint-placeholder-count="4">
        <div style="display: flex; gap: 10px; align-items: flex-start; padding: 6px 0">
          <div style="width: 22px; height: 22px; border-radius: 99px; background: #FBE9E7; color: #A12A1F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; flex-shrink: 0; margin-top: 2px">!</div>
          <div style="font-size: 14px; line-height: 1.7">{{x}}</div>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E7E8E2; border-radius: 22px; padding: 16px">
      <div style="font-size: 12px; font-weight: 700; color: #0B5D3B; letter-spacing: 0.04em; margin-bottom: 8px">{{t.solH}}</div>
      <sc-for list="{{sols}}" as="x" hint-placeholder-count="6">
        <div style="display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-bottom: 1px dashed #E1E3DC">
          <div style="width: 22px; height: 22px; border-radius: 99px; background: #E3F0E8; color: #0B5D3B; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
          </div>
          <div>
            <div style="font-size: 14px; font-weight: 700">{{x.h}}</div>
            <div style="font-size: 13px; color: #4A534C; line-height: 1.7">{{x.b}}</div>
          </div>
        </div>
      </sc-for>
    </div>
    <div style="background: #15201A; color: #FFFFFF; border-radius: 22px; padding: 16px">
      <div style="font-size: 12px; font-weight: 700; color: #F2B33D; letter-spacing: 0.04em; margin-bottom: 8px">{{t.benH}}</div>
      <sc-for list="{{bens}}" as="x" hint-placeholder-count="4">
        <div style="font-size: 14px; line-height: 1.8; padding: 4px 0; color: #E6ECE8">• {{x}}</div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E7E8E2; border-radius: 22px; padding: 16px">
      <div style="font-size: 12px; font-weight: 700; color: #7A4B00; letter-spacing: 0.04em; margin-bottom: 10px">{{t.phaseH}}</div>
      <sc-for list="{{phases}}" as="x" hint-placeholder-count="3">
        <div style="display: flex; gap: 12px; align-items: flex-start; padding: 6px 0">
          <div style="width: 30px; height: 30px; border-radius: 10px; background: #FCEFD6; color: #7A4B00; display: flex; align-items: center; justify-content: center; font-family: Inter, sans-serif; font-weight: 800; flex-shrink: 0">{{x.n}}</div>
          <div style="font-size: 14px; line-height: 1.7; padding-top: 3px">{{x.t}}</div>
        </div>
      </sc-for>
    </div>
    <div style="text-align: center; font-size: 12px; color: #5D665F; padding: 6px 0 4px">{{t.by}}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {lang: 'ur'};
    this.C = {
      ur: {
        t: {logo:'م', langOther:'English', title:'ممتاز جنرل اسٹور — ڈیجیٹل کھاتہ اور آرڈر ایپ', sub:'رجسٹر کی جگہ موبائل۔ گاہک گھر بیٹھے آرڈر کریں اور اپنا کھاتہ خود دیکھیں۔',
          probH:'آج کا مسئلہ', solH:'ہمارا حل', benH:'دکان کو فائدہ', phaseH:'کیسے شروع ہوگا', by:'تیار کردہ: اسد علی · NexaGrow'},
        probs:['اُدھار کا حساب رجسٹر میں — مہینے کے آخر میں گھنٹوں جوڑنا','گاہک کہتا ہے "میں نے یہ نہیں لیا" — ثبوت صرف کاپی','رجسٹر گم یا خراب ہو جائے تو سارا حساب خطرے میں','بزرگوں اور خواتین کے لیے دکان تک آنا مشکل'],
        sols:[{h:'ڈیجیٹل کھاتہ',b:'ہر اُدھار اور وصولی موبائل پر، کل خود بخود'},{h:'گاہک خود دیکھے',b:'اپنا کھاتہ اپنے موبائل پر — جھگڑا ختم'},{h:'WhatsApp بل',b:'مہینے کے آخر میں ایک بٹن سے سب کو حساب'},{h:'گھر بیٹھے آرڈر',b:'ایپ یا WhatsApp سے، گھر تک ڈیلیوری'},{h:'ماہانہ لسٹ',b:'پورا راشن ایک ٹچ میں دوبارہ'},{h:'اردو اور English',b:'سادہ، بڑے بٹن — ہر کوئی چلا سکے'}],
        bens:['وقت کی بچت، حساب میں غلطی کم','وصولی جلدی — گاہک کو بقایا ہر وقت نظر آتا ہے','آس پاس کے گاؤں سے بھی آرڈر','علاقے میں "ممتاز اسٹور کی ایپ" کا نام'],
        phases:[{n:'1',t:'دکاندار کا ڈیجیٹل کھاتہ + WhatsApp بل'},{n:'2',t:'گاہک اپنا کھاتہ خود دیکھیں'},{n:'3',t:'آرڈر، ڈیلیوری اور ماہانہ لسٹ'}]
      },
      en: {
        t: {logo:'M', langOther:'اردو', title:'Mumtaz General Store — Digital Khata & Ordering App', sub:'Your phone replaces the register. Customers order from home and check their own khata.',
          probH:'THE PROBLEM TODAY', solH:'OUR SOLUTION', benH:'WHAT THE STORE GAINS', phaseH:'HOW WE START', by:'Built by Asad Ali · NexaGrow'},
        probs:['Credit is kept in a paper register — hours of adding up at month end','A customer says "I never took that" — the only proof is the notebook','If the register is lost or damaged, the whole record is at risk','Elderly people and women find it hard to come to the store'],
        sols:[{h:'Digital khata',b:'Every credit and payment on the phone, totals done automatically'},{h:'Customers see it themselves',b:'Their own khata on their own phone — no more disputes'},{h:'WhatsApp bills',b:'Month-end statements to everyone with one tap'},{h:'Order from home',b:'Through the app or WhatsApp, delivered to the door'},{h:'Monthly list',b:'Reorder the full monthly groceries in one tap'},{h:'Urdu and English',b:'Simple, big buttons — anyone can use it'}],
        bens:['Saves time, fewer mistakes in accounts','Faster recovery — customers always see what they owe','Orders from nearby villages too','"Mumtaz Store has its own app" — a name in the area'],
        phases:[{n:'1',t:'Shopkeeper digital khata + WhatsApp bills'},{n:'2',t:'Customers view their own khata'},{n:'3',t:'Ordering, delivery and monthly list'}]
      }
    };
  }
  renderVals() {
    const s = this.state, c = this.C[s.lang];
    return {
      t: c.t, probs: c.probs, sols: c.sols, bens: c.bens, phases: c.phases,
      lang: s.lang, dir: s.lang === 'ur' ? 'rtl' : 'ltr',
      font: s.lang === 'ur' ? "'Noto Naskh Arabic', Inter, sans-serif" : "Inter, system-ui, sans-serif",
      toggleLang: () => this.setState({lang: s.lang === 'ur' ? 'en' : 'ur'})
    };
  }
}
</script>
</body>
</html>
